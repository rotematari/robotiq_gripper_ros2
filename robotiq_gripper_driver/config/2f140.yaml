# Robotiq 2F-140. Copy and edit for your setup; `port` is set by the launch file.
/**:
  ros__parameters:
    model: 2f140
    device_id: 9
    joint_name: gripper_width
    status_rate: 20.0      # Hz; at least 2 (the gripper faults after 1 s without communication)
    default_speed: 0.05    # m/s, used when a goal has no velocity (range 0.03-0.25)
    default_force: 30.0    # N, used when a goal has no effort (range 10-125, approximate)
    open_register: 0       # position register at full opening; calibrate with calipers
    closed_register: 255   # position register at zero opening
    move_timeout: 5.0      # s allowed beyond a full stroke at the commanded speed
    auto_activate: false   # activation sweeps the fingers through the full stroke
